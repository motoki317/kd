# GoReleaser config for kd app releases (tag vX.Y.Z → GitHub Release + ghcr.io image).
# Chart releases are independent (tag chart-vX.Y.Z → .github/workflows/release-chart.yaml).
version: 2

project_name: kd

# The chart releases on its own chart-vX.Y.Z tags, which often sit on different commits than the app
# vX.Y.Z tags but can share one. Ignore them so GoReleaser never resolves .Tag/.Version (the version
# stamp + image label) — or the changelog's previous-tag range — to a chart tag.
git:
  ignore_tags:
    - "chart-*"

before:
  hooks:
    # The binary embeds the web client (embed_web tag), so the client must be built first.
    # Hooks don't run in a shell — `npm --prefix` instead of `cd web && …`.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - main: ./cmd/kd
    binary: kd
    env:
      - CGO_ENABLED=0
    tags:
      - embed_web
    flags:
      - -trimpath
    # Stamp internal/version so the About card and `kd --version` report the release. .Tag keeps the
    # leading v (matching git describe on the just/Docker paths); .FullCommit is the full SHA. (The
    # GoReleaser default ldflags target main.version/commit, which kd doesn't declare — hence the
    # explicit -X into the internal/version package.)
    ldflags:
      - -s -w
      - -X github.com/motoki317/kd/internal/version.version={{ .Tag }}
      - -X github.com/motoki317/kd/internal/version.commit={{ .FullCommit }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - README.md

dockers_v2:
  - images:
      - ghcr.io/motoki317/kd
    # Image tags carry NO 'v' prefix ({{ .Version }} is the git tag minus the leading v): the
    # image is ghcr.io/motoki317/kd:X.Y.Z, not :vX.Y.Z. The chart's appVersion must match this
    # (it defaults image.tag to X.Y.Z). The git tag itself stays vX.Y.Z (the release trigger).
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    # ghcr.io reads the source label to link the package to this repository.
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "A human-friendly, read-only, live Kubernetes dashboard"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "A human-friendly, read-only, live Kubernetes dashboard"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.*\))?!?:'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^chore(\(.*\))?:'
      - '^style(\(.*\))?:'
      - '^ci(\(.*\))?:'

release:
  footer: |
    **Docker image**: `ghcr.io/motoki317/kd:{{ .Version }}` (linux amd64/arm64)
