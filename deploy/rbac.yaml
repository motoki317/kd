# The single read-only ServiceAccount kd runs as. kd applies its own authorization
# (policy.csv) on top; this ClusterRole only needs read verbs.
# See docs/ADR/20260527-kubernetes-access-model.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kd
  namespace: kd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kd-readonly
# v1 of dynamic-informer kd discovers every API resource the cluster exposes (including CRDs
# installed at runtime) and watches them via a single dynamic informer factory. That requires
# read access to all groups + resources — same model ArgoCD uses. Operators who want a narrow
# allowlist can copy the pre-CRD rule set documented in deploy/README.md as a starting point.
# kd's own policy.csv (kd app-layer RBAC) is where per-user/per-namespace authz lives.
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kd-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kd-readonly
subjects:
  - kind: ServiceAccount
    name: kd
    namespace: kd
