apiVersion: apps/v1
kind: Deployment
metadata:
  name: kd
  namespace: kd
  labels:
    app: kd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kd
  template:
    metadata:
      labels:
        app: kd
    spec:
      serviceAccountName: kd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kd
          image: ghcr.io/motoki317/kd:latest
          args:
            - --addr=:9123
            - --policy=/etc/kd/policy.csv
            # Trusts X-Forwarded-User from the forward-auth proxy (default). Restrict who may
            # assert it with --trusted-proxies=<CIDR> once the proxy source range is known.
          env:
            - name: KD_DEFAULT_ROLE
              valueFrom:
                configMapKeyRef:
                  name: kd-policy
                  key: policy.default
          ports:
            - name: http
              containerPort: 9123
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policy
              mountPath: /etc/kd
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: kd-policy
            items:
              - key: policy.csv
                path: policy.csv
---
apiVersion: v1
kind: Service
metadata:
  name: kd
  namespace: kd
  labels:
    app: kd
spec:
  selector:
    app: kd
  ports:
    - name: http
      port: 80
      targetPort: http
