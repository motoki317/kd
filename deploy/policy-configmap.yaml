# Declarative kd authorization, ArgoCD-style. Edit and re-apply; kd hot-reloads it (no restart).
# See docs/ADR/20260527-declarative-rbac-policy-csv.md.
#
# Grammar:
#   p, <subject>, <namespace-glob>, <resource>, <action>, <effect>
#   g, <subject>, <role>
# Subjects are usernames/groups from the identity header, or role:* tokens.
# Resources: namespaces | workloads | pods | logs | events | rbac | nodes | *
# Actions: get | list | watch (read verbs in v1). Effect: allow | deny (deny overrides).
# Built-in roles role:readonly and role:admin always exist; policy.default below is the
# role every authenticated user implicitly has.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kd-policy
  namespace: kd
data:
  policy.default: "role:readonly"
  policy.csv: |
    # Cluster operators get full read access everywhere.
    g, toki, role:admin
    g, kube-admins, role:admin

    # The app-team group sees only its own namespaces; nothing else.
    p, app-team, team-a-*, *, *, allow
    p, app-team, team-b-*, *, *, allow

    # Anyone may read workloads/pods but not pod logs in the sensitive namespace.
    p, role:readonly, secure, logs, *, deny
