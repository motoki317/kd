# Running · not ready — the readiness probe fails forever; the Service shows 0/1 ready endpoints.
apiVersion: v1
kind: Namespace
metadata: { name: diag-readiness }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness
  namespace: diag-readiness
spec:
  replicas: 1
  selector:
    matchLabels: { app: readiness }
  template:
    metadata:
      labels: { app: readiness }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: readiness
  namespace: diag-readiness
spec:
  selector: { app: readiness }
  ports:
    - port: 80
      targetPort: 8080
