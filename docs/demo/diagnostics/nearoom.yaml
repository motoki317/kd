# Near-OOM, not yet killed — memory ≥90% of the container's OWN limit: its card alarms in words and its
# Lim bar reads ~91% while the idle sidecar stays calm. Needs metrics; readings lag ~30–60s after start.
apiVersion: v1
kind: Namespace
metadata: { name: diag-nearoom }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nearoom
  namespace: diag-nearoom
spec:
  replicas: 1
  selector:
    matchLabels: { app: nearoom }
  template:
    metadata:
      labels: { app: nearoom }
    spec:
      containers:
        - name: app
          # The interpreter adds ~3Mi; 113Mi lands the container at ~91% of the 128Mi limit.
          image: python:3.12-alpine
          command: ["python3", "-c", "x = bytearray(113*1024*1024); import time; time.sleep(36000)"]
          resources:
            limits:
              memory: 128Mi
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "36000"]
