# CrashLoopBackOff — the container card reads "last exit" + restart count; the Logs tab streams the FATAL line.
apiVersion: v1
kind: Namespace
metadata: { name: diag-crashloop }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: diag-crashloop
spec:
  replicas: 3
  selector:
    matchLabels: { app: crashloop }
  template:
    metadata:
      labels: { app: crashloop }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - 'echo "FATAL: cannot connect to database postgres:5432: connection refused"; exit 1'
