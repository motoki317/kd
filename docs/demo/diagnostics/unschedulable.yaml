# Unschedulable — the pod headline carries the FailedScheduling message (insufficient memory).
apiVersion: v1
kind: Namespace
metadata: { name: diag-unschedulable }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unschedulable
  namespace: diag-unschedulable
spec:
  replicas: 1
  selector:
    matchLabels: { app: unschedulable }
  template:
    metadata:
      labels: { app: unschedulable }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              memory: 9000Gi
