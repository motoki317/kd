# CreateContainerConfigError — the waiting message names the missing Secret.
apiVersion: v1
kind: Namespace
metadata: { name: diag-badconfig }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: badconfig
  namespace: diag-badconfig
spec:
  replicas: 1
  selector:
    matchLabels: { app: badconfig }
  template:
    metadata:
      labels: { app: badconfig }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - secretRef:
                name: missing-secret
