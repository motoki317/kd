# Init:CrashLoopBackOff — the init container's card carries the failure; the app container never starts.
apiVersion: v1
kind: Namespace
metadata: { name: diag-initfail }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: initfail
  namespace: diag-initfail
spec:
  replicas: 1
  selector:
    matchLabels: { app: initfail }
  template:
    metadata:
      labels: { app: initfail }
    spec:
      initContainers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ['echo "waiting for schema lock..."; echo "ERROR: migration lock held by another process" >&2; exit 1']
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
