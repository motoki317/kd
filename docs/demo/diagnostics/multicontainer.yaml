# One container of two failing — the sidecar's card is red while web stays visibly calm.
apiVersion: v1
kind: Namespace
metadata: { name: diag-multicontainer }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multicontainer
  namespace: diag-multicontainer
spec:
  replicas: 1
  selector:
    matchLabels: { app: multicontainer }
  template:
    metadata:
      labels: { app: multicontainer }
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sleep", "3600"]
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ['echo "sidecar: failed to read /etc/config/token: no such file"; exit 3']
