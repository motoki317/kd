# Pending PVC — the PVC stays Pending ("storageclass not found" in Events) and the mounting pod pends with it.
apiVersion: v1
kind: Namespace
metadata: { name: diag-pendingpvc }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: diag-pendingpvc
spec:
  storageClassName: does-not-exist
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pendingpvc
  namespace: diag-pendingpvc
spec:
  replicas: 1
  selector:
    matchLabels: { app: pendingpvc }
  template:
    metadata:
      labels: { app: pendingpvc }
    spec:
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
