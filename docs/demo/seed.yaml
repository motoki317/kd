# Demo dataset for the README screenshots (docs/images/kd_*.png).
#
# Fictional names only (shop/blog/team-a, api/web/cache) — never a real cluster's resources.
# Apply to a THROWAWAY local cluster so the namespace sidebar and context picker stay clean (the
# originals show a single context "kd ▸ shop" — only reproducible with one context loaded):
#
#   k3d cluster create demo --servers-memory 6GB --kubeconfig-update-default=false --wait
#   k3d kubeconfig get demo > /tmp/demo.kubeconfig
#   KUBECONFIG=/tmp/demo.kubeconfig kubectl apply -f docs/demo/seed.yaml
#   KUBECONFIG=/tmp/demo.kubeconfig ./kd -dev-user dev -addr :8099
#
# --servers-memory 6GB caps the node's reported capacity so the Nodes-view usage bars register
# (an unbounded k3d node reports the whole host's RAM, shrinking every bar to a sliver). Wait for
# `kubectl top pods -n shop` to return values before shooting — the Nodes view and the pod gauge
# both need live metrics. Tear down with `k3d cluster delete demo` when done.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: Namespace
metadata: { name: blog }
---
apiVersion: v1
kind: Namespace
metadata: { name: team-a }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shop-api, namespace: shop }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: api-config, namespace: shop }
data:
  APP_MODE: "production"
  LOG_LEVEL: "info"
  index.html: |
    <h1>shop api</h1>
---
apiVersion: v1
kind: Secret
metadata: { name: api-credentials, namespace: shop }
type: Opaque
stringData:
  API_KEY: "demo-key-not-real"
  DB_PASSWORD: "demo-pass-not-real"
---
# api: 1 replica, mounts the ConfigMap + Secret, container named "main" (kd defaults the log view to it)
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: shop, labels: { app: api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      serviceAccountName: shop-api
      containers:
        - name: main
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "100m", memory: "256Mi" }
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-credentials }
          volumeMounts:
            - { name: config, mountPath: /usr/share/nginx/html }
      volumes:
        - name: config
          configMap: { name: api-config }
---
# web: 3 replicas
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: shop, labels: { app: web } }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: main
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "100m", memory: "256Mi" }
---
# cache: 1 replica
apiVersion: apps/v1
kind: Deployment
metadata: { name: cache, namespace: shop, labels: { app: cache } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cache } }
  template:
    metadata: { labels: { app: cache } }
    spec:
      containers:
        - name: main
          image: memcached:1.6-alpine
          ports: [{ containerPort: 11211 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: 80, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: 80, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: shop }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: shop }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: shop }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: api } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: report, namespace: shop }
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo generating daily report"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: config-reader, namespace: shop }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: shop-api-config-reader, namespace: shop }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
subjects:
  - kind: ServiceAccount
    name: shop-api
    namespace: shop
---
# Minimal occupants so blog/team-a appear populated in the sidebar
apiVersion: apps/v1
kind: Deployment
metadata: { name: site, namespace: blog, labels: { app: site } }
spec:
  replicas: 1
  selector: { matchLabels: { app: site } }
  template:
    metadata: { labels: { app: site } }
    spec:
      containers:
        - name: main
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: team-a, labels: { app: worker } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
