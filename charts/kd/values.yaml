# Default values for kd.
# This is a YAML-formatted file. Every key carries `# @schema` annotations consumed by the
# helm-values-schema-json plugin (`helm schema`) to regenerate values.schema.json.

# -- Number of kd replicas. kd is stateless (informer cache rebuilds on start), so it scales
# horizontally, but a single replica is plenty for most clusters.
replicaCount: 1 # @schema type:integer; minimum:1

image:
  # -- Container image repository for the kd server.
  repository: ghcr.io/motoki317/kd
  # -- Image pull policy.
  pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: "" # @schema type:string

# -- Image pull secrets for a private registry.
imagePullSecrets: [] # @schema type:array; item:object

# -- Override the chart name portion of resource names.
nameOverride: "" # @schema type:string
# -- Override the full generated resource name.
fullnameOverride: "" # @schema type:string

# kd server configuration. Each field maps to a CLI flag / KD_* env var on the binary.
config:
  # -- HTTP listen address. The container port is derived from this.
  addr: ":9123"
  # -- Request header carrying the authenticated username (set by the forward-auth proxy).
  userHeader: "X-Forwarded-User"
  # -- Optional request header carrying the user's groups. Empty disables group-based policy.
  groupsHeader: "" # @schema type:string
  # -- Delimiter splitting the groups header value.
  groupsDelimiter: ","
  # -- Comma-separated CIDRs allowed to assert the identity header. Empty trusts all sources —
  # set this whenever kd is reachable without going through the proxy.
  trustedProxies: "" # @schema type:string
  # -- How often kd polls the policy file for changes (hot reload, no restart).
  policyReloadInterval: "10s"
  # -- Informer resync period.
  resync: "10m"
  # -- Comma-separated extra resource names to skip from eager informer startup, on top of the
  # built-in high-cardinality defaults (events, leases, endpoints, endpointslices,
  # controllerrevisions, ephemeralreports).
  skipKinds: "" # @schema type:string
  # -- Comma-separated resource names to force-include in eager startup, overriding both
  # skipKinds and the built-in defaults. (Not useful for "events": the Events tab always
  # queries the API live — short-lived, high-cardinality events are deliberately never cached.)
  eagerKinds: "" # @schema type:string
  # -- Extra raw CLI arguments appended to the kd command.
  extraArgs: [] # @schema type:array; item:string

# Declarative kd authorization, rendered into a policy.yaml ConfigMap that is mounted into
# the pod and hot-reloaded. Roles bundle allow/deny rules; users and groups are assigned
# roles; a matching deny always beats an allow. Built-in roles: `viewer` (read everything)
# and `admin` (every action). The full format lives in the chart README.
policy:
  # -- Mount the policy ConfigMap and point kd at it. When false, kd runs on the built-in
  # default: every authenticated user is a viewer.
  enabled: true # @schema type:boolean
  # -- Roles every authenticated user automatically has. Set to [] to lock the cluster
  # down, so only the users/groups assignments below grant access.
  defaultRoles: ["viewer"] # @schema type:array; item:string
  # -- Custom role definitions. Each allow/deny rule lists `namespaces`, `resources`, and
  # `actions` glob patterns; omitting a field matches everything, and `clusterScoped: true`
  # targets cluster-scoped resources (Nodes, PVs, CRDs, …) instead of namespaces. For example:
  #   team-a:
  #     description: Read everything in team-a's namespaces, except pod logs.
  #     allow:
  #       - namespaces: [team-a-*]
  #     deny:
  #       - namespaces: [team-a-*]
  #         resources: [logs]
  #   cluster-viewer:
  #     allow:
  #       - clusterScoped: true
  roles: {} # @schema type:object
  # -- Role assignments per username (the identity header value). For example:
  #   alice: [admin]
  #   bob: [team-a]
  users: {} # @schema type:object
  # -- Role assignments per group (the groups header values). For example:
  #   platform-team: [admin]
  #   team-a-developers: [team-a]
  groups: {} # @schema type:object
  # -- Guardrail rules denied to every caller, whatever their roles. For example, to hide
  # pod logs in a sensitive namespace from everyone:
  #   - namespaces: [secure]
  #     resources: [logs]
  deny: [] # @schema type:array; item:object

serviceAccount:
  # -- Create a ServiceAccount for kd to run as.
  create: true # @schema type:boolean
  # -- Name of the ServiceAccount. Generated from the release when empty.
  name: "" # @schema type:string
  # -- Annotations to add to the ServiceAccount.
  annotations: {} # @schema type:object

rbac:
  # -- Create the ClusterRole + ClusterRoleBinding granting kd its cluster read access.
  create: true # @schema type:boolean
  # -- ClusterRole rules. The default grants wildcard read so the dynamic-informer factory can
  # discover every API resource (including CRDs installed at runtime) — the same model ArgoCD
  # ships with. Replace with a narrow allowlist for least privilege (see the chart README); the
  # trade-off is that new CRDs aren't visible until added here.
  rules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]

service:
  # -- Service type.
  type: ClusterIP # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  # -- Service port (forwards to the container's HTTP port).
  port: 80 # @schema type:integer; minimum:1; maximum:65535
  # -- Annotations to add to the Service.
  annotations: {} # @schema type:object

# Standard Kubernetes Ingress. Use this on most clusters; for a Traefik forward-auth edge use
# ingressRoute below instead.
ingress:
  # -- Create a standard Kubernetes Ingress.
  enabled: false # @schema type:boolean
  # -- IngressClass name.
  className: "" # @schema type:string
  # -- Annotations to add to the Ingress (e.g. cert-manager, auth middleware).
  annotations: {} # @schema type:object
  # -- Ingress hosts and their paths.
  hosts:
    - host: kd.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration.
  tls: [] # @schema type:array; item:object

# Traefik IngressRoute — mirrors the upstream forward-auth setup, where a middleware injects
# X-Forwarded-User so kd never sees an unauthenticated request. Requires the Traefik CRDs.
ingressRoute:
  # -- Create a Traefik IngressRoute (instead of a standard Ingress).
  enabled: false # @schema type:boolean
  # -- Traefik entryPoints to bind.
  entryPoints:
    - websecure
  # -- Host matched by the route's Rule.
  host: kd.example.com
  # -- Middlewares applied to the route (e.g. the forward-auth middleware that emits the
  # identity header). Each item is {name, namespace}.
  middlewares: [] # @schema type:array; item:object
  # -- TLS block. Empty object enables TLS with the default resolver; set to null to disable.
  tls: {} # @schema type:[object, null]

# -- Compute resources for the kd container. Sized to kd's measured footprint after the
# informer-cache trimming + GOGC tuning (~90Mi steady, ~120Mi under heavy concurrent load on a
# medium cluster); the limit keeps ~2x headroom for larger clusters and viewer bursts. Memory
# scales with object count — raise both for very large clusters. No CPU limit on purpose: kd is
# latency-sensitive and a limit would throttle it and shrink GOMAXPROCS (which the GC tuning assumes
# tracks the node's cores).
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# -- Pod-level security context. kd runs as non-root with a runtime-default seccomp profile.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. kd needs no write access to its root filesystem and
# drops every capability.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Readiness probe. Overrides are merged over the chart defaults.
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3

# -- Liveness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10

# -- Extra environment variables for the kd container.
extraEnv: [] # @schema type:array; item:object

# -- Annotations to add to the pod.
podAnnotations: {} # @schema type:object
# -- Labels to add to the pod.
podLabels: {} # @schema type:object

# -- Node selector for pod scheduling.
nodeSelector: {} # @schema type:object
# -- Tolerations for pod scheduling.
tolerations: [] # @schema type:array; item:object
# -- Affinity rules for pod scheduling.
affinity: {} # @schema type:object
