{{- if .Values.policy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kd.fullname" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kd.labels" . | nindent 4 }}
data:
  # The policy document is everything under .Values.policy except the chart-control flag.
  policy.yaml: |
    {{- omit .Values.policy "enabled" | toYaml | nindent 4 }}
{{- end }}
