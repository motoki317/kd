apiVersion: v2
name: kd
description: A read-only, ArgoCD-style Kubernetes topology dashboard behind a forward-auth proxy.
type: application
# Chart version: bump on any chart change (templates/values), then tag chart-vX.Y.Z to
# release (CI verifies the tag matches). SemVer, independent of the app version below.
version: 0.2.0
# The kd release whose image this chart deploys by default (the image.tag fallback). No 'v'
# prefix: kd image tags are X.Y.Z (not vX.Y.Z), so this must match the published image tag.
# Bump when a new kd version is released; override image.tag to pin a different build.
appVersion: "0.2.0"
home: https://github.com/motoki317/kd
sources:
  - https://github.com/motoki317/kd
keywords:
  - kubernetes
  - dashboard
  - topology
  - observability
maintainers:
  - name: motoki317
    url: https://github.com/motoki317
